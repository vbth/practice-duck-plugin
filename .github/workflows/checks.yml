name: Checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
jobs:
  attribution:
    runs-on: ubuntu-latest
    steps:
      - name: No Claude attribution in the commits of this PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/commits" \
            --jq '.[] | "\(.sha[0:7]) \(.commit.author.email) \(.commit.committer.email)\n\(.commit.message)"' > commits.txt
          bad=$(grep -inE 'noreply@anthropic\.com|^co-authored-by:.*claude|^claude-session:|claude\.ai/code|generated with .?claude' commits.txt || true)
          if [ -n "$bad" ]; then echo "Claude attribution found in commits (see CLAUDE.md):"; echo "$bad"; exit 1; fi
  gitleaks:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Scan the commits of this PR for secrets
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh auth setup-git
          gh repo clone "$GITHUB_REPOSITORY" repo
          git -C repo fetch --quiet origin "pull/$PR_NUMBER/head"
          docker run --rm -v "$PWD/repo:/repo" ghcr.io/gitleaks/gitleaks:v8.18.4 \
            detect --source /repo --redact --log-opts="$BASE_SHA..$HEAD_SHA"
